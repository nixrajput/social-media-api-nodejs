name: Bug Report
description: File a bug report for the social media API
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: ["nixrajput"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
        Before submitting, please check the [existing issues](https://github.com/nixrajput/social-media-api-nodejs/issues) to avoid duplicates.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the API is affected?
      multiple: false
      options:
        - Auth / sessions / 2FA
        - Users / profiles / graph
        - Posts / comments / feed
        - Chat / realtime (WebSocket / E2EE)
        - Media / uploads
        - Notifications / push
        - Database / migrations
        - CI / Build / deploy
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you see, and what did you expect?
      placeholder: "Expected: ... Actual: ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps (include the request method, path, and body where relevant).
      placeholder: |
        1. POST /api/v1/...
        2. With body '...'
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: API version or commit
      description: package.json version or the commit SHA you are running.
      placeholder: "e.g. 2.0.0 or abc1234"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      multiple: false
      options:
        - Local (dev)
        - CI
        - Production
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error response
      description: Paste any relevant logs or the error envelope (include the requestId). Formatted as code.
      render: shell

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue you agree to follow our [Code of Conduct](https://github.com/nixrajput/social-media-api-nodejs/blob/master/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
