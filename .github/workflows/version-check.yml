name: Version check

on:
  pull_request:
    branches: [master]

jobs:
  version-bumped:
    name: version bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare package.json version with base
        run: |
          BASE=$(git show origin/${{ github.base_ref }}:package.json | jq -r .version)
          HEAD=$(jq -r .version package.json)
          echo "base=$BASE head=$HEAD"
          if [ "$BASE" = "$HEAD" ]; then
            echo "::error::package.json version must be bumped"
            exit 1
          fi
